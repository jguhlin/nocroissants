[workspace]
members = ["no_croissants", "annotate"]
resolver = "2"

[workspace.dependencies]
eframe = "0.28.1"
egui = "0.28.1"
env_logger = "0.11.5"
reqwest = { version = "0.12.7", features = ["json"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.40.0", features = ["full"] }
